# 15분 갱신 배치(#52): R2 상태 받기 → 실시간·일별 갱신 → 응답 JSON 생성 → 바뀐 파일만 R2 에 올리기(batch.py, #51)
# 공개 저장소에서 60일 동안 저장소 활동이 없으면 예약 실행이 자동으로 꺼진다(GitHub 문서). 다시 켜기는 런북(#55)에 적는다
name: refresh

on:
  schedule:
    # Actions 예약은 정각에 붐벼 늦거나 빠질 수 있어 7분 어긋나게 15분마다 돈다(UTC)
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

# 실행이 겹치면 두 실행이 R2 manifest 를 서로 덮어쓴다. 앞 실행이 끝날 때까지 기다린다(대기는 하나만 남는다)
concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    # 단계별 상한: 일별 재계산(첫 실행 212초) + 대피시설 받기(5분 + 요청 하나 20초, shelters.FETCH_BUDGET_SECONDS)
    # + 뉴스(3분 + 요청 하나 10초) + 준비·받기·올리기(약 1분) ≈ 13분. 15분 주기 안에 끝나게 14분으로 둔다
    # (#52, 10분에서는 취소된 실행이 있었다)
    # shortcut: 여행경보·재외공관까지 한꺼번에 느리면(각각 최대 약 1분) 14분을 넘을 수 있다. 취소되면 올리기와 .failed 저장도
    #   빠져 다음 실행이 한 번 더 받는다. 자주 보이면 batch 에 전체 마감을 두고 남은 시간을 각 단계에 넘길 것
    timeout-minutes: 14
    env:
      TZ: Asia/Seoul  # 서버(VM)와 같은 시간대. "어제"·하루 1회 판단에 로컬 날짜를 쓰는 코드가 있다(RUNBOOK 1.3)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # batch.py 의 hashlib.file_digest 는 3.11 이상
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      # 시크릿은 이 단계에만 준다. aws CLI 는 러너에 기본으로 깔려 있다
      - run: python batch.py
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
